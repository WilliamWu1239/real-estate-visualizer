<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real‑Estate Image Customizer</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h1>Real‑Estate Image Customizer</h1>
    <p>Upload a photo, paint areas to change, describe your modification, and generate a preview.</p>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>1) Upload</h2>
      <input type="file" id="imageInput" accept="image/*" />
      <div id="canvasWrap">
        <canvas id="imageCanvas"></canvas>
        <canvas id="maskCanvas"></canvas>
        <canvas id="overlayCanvas"></canvas>
        <!-- Step 3A: Hidden Mask Stack -->
        <canvas id="baseMaskCanvas" style="display:none;"></canvas>
        <canvas id="addMaskCanvas" style="display:none;"></canvas>
        <canvas id="subMaskCanvas" style="display:none;"></canvas>
        <canvas id="finalMaskCanvas" style="display:none;"></canvas>
      </div>

      <div class="tools">
        <label>Brush: <input type="range" id="brushSize" min="5" max="80" value="28" /></label>
        <button id="modePaint" class="primary">Paint</button>
        <button id="segmentBtn">Select Objects</button>
        <label title="Detection sensitivity">
          <input type="range" id="sensitivity" min="0.1" max="0.9" step="0.05" value="0.55"
            style="width:60px; vertical-align:middle;" />
          <span style="font-size:0.8em">Sens.</span>
        </label>
        <label><input type="checkbox" id="showSegments" checked /> Show Overlays</label>
        <div id="objectList"></div>
        <div id="objectActions" style="display:none; margin-top: 8px; align-items: center; gap: 8px;">
          <button id="addToMaskBtn" class="primary" style="display:none">Add to Mask</button>
          <input type="text" id="renameInput" placeholder="New name" />
          <button id="renameBtn" class="secondary">Rename</button>
          <button id="deleteObjectBtn" class="destructive">Delete</button>
        </div>

        <button id="modeErase">Erase</button>
        <button id="clearMask">Clear Mask</button>
        <span class="hint">White = edit region, Black = keep</span>
      </div>
    </section>

    <section class="panel">
      <h2>2) Describe your change</h2>
      <textarea id="prompt" rows="6"
        placeholder="e.g., Replace dark cabinets with white shaker cabinets; add a marble island with brass pendant lights; realistic lighting"></textarea>

      <label>Negative prompt
        <input id="negative" type="text" value="blurry, low quality, distorted, watermark, text" />
      </label>

      <div class="grid2">
        <label>Steps <input id="steps" type="number" min="10" max="80" value="35" /></label>
        <label>Guidance <input id="guidance" type="number" step="0.1" min="1" max="15" value="7.5" /></label>
        <label>Strength <input id="strength" type="number" step="0.05" min="0.1" max="1.0" value="0.65" /></label>
        <label>Seed <input id="seed" type="number" placeholder="(optional)" /></label>
      </div>

      <button id="generate" class="primary big">Generate</button>

      <div id="status"></div>
    </section>

    <section class="panel">
      <h2>3) Result</h2>
      <div id="resultWrap">
        <img id="resultImg" alt="Result will appear here" />
      </div>
      <div class="row">
        <button id="downloadBtn">Download PNG</button>
      </div>
    </section>
  </main>

  <footer>
    <p>For visualization only; consult professionals for feasibility and structural safety.</p>
  </footer>

  <script src="app.js"></script>
</body>

</html>
